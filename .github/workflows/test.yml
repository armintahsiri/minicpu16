# MiniCPU-16 CI (Phase 5B).
#
# This workflow has NOT been executed on GitHub.  It is committed as the intended
# runner definition and is explicitly unverified.
#
# What CI runs: \`make test\`, the quick suite only.  That includes the Phase 4
# checks, the fuzz-generator diversity assertion, all leaf RTL testbenches, the
# quick CYCLE-EXACT differential suite on NVC and GHDL (retirement trace
# including retire cycles, final cycle count and pipeview), a 40-program
# cycle-exact fuzz (8 of them on GHDL) including the forwarding-targeted mode,
# and the FORWARDING=false architectural regression subset.
#
# What stays local (not run by CI): the full 1000-program forwarding fuzz
# (\`make rtl-fuzz\`), the general 300-program fuzz (\`make rtl-fuzz-general\`), the
# mutation check (\`make mutation\`), and synthesis/Fmax (\`make synth-smoke\`).
#
# Not verified anywhere yet: hardware, post-synthesis simulation, timing
# sign-off, and the package/action versions below.
#
# Package/action notes:
#   - nickg/setup-nvc@v1 installs NVC; NVC 1.23.0 was used locally.
#   - Ubuntu's "ghdl" package provides GHDL 6.x with VHDL-2008.  GHDL 6.0.0 was
#     used locally (official LLVM macOS archive); the Ubuntu version is unpinned.
#   - Python 3.12 is used; all tools are standard library only.

name: test

on:
  push:
  pull_request:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NVC (VHDL-2008)
        uses: nickg/setup-nvc@v1
        with:
          version: latest

      - name: Install GHDL (VHDL-2008)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          nvc --version
          ghdl --version

      - name: Quick cycle-exact suite (Phase 4 + Phase 5B)
        run: make test
